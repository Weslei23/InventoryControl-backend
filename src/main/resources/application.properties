spring.application.name=InventoryControl
spring.datasource.url=jdbc:postgresql://localhost:5432/simplestock
spring.datasource.username=postgres
spring.datasource.password=1234

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.servlet.multipart.enabled=true
spring.servlet.multipart.file-size-threshold=2KB
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=215MB

secretKey=secret
file.upload-dir=./shared/files/products

app.superuser.username=${SUPERUSER_USERNAME:weslei}
app.superuser.email=${SUPERUSER_EMAIL:sschmittweslei@gmail.com}
app.superuser.password=${SUPERUSER_PASSWORD:was}
